repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd simulations && uv run mypy .'
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        # `-x`: without it bandit walks site-packages, which is slow and
        # reports other people's code, and `mutants/` -- the copy of this tree
        # that mutmut rewrites -- which is neither committed nor code anyone
        # wrote.
        entry: bash -c 'cd simulations && uv run bandit -r . -x ./.venv,./.venv_new,./mutants'
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: bash -c 'cd simulations && uv run vulture .'
        language: system
        types: [python]
        pass_filenames: false
      - id: xenon
        name: xenon
        entry: bash -c 'cd simulations && uv run xenon --max-absolute B --max-modules B --max-average A --exclude "mutants/*,.venv/*,.venv_new/*" .'
        language: system
        types: [python]
        pass_filenames: false
      - id: tach
        name: tach
        entry: bash -c 'cd simulations && uv run tach check'
        language: system
        types: [python]
        pass_filenames: false

      # Publication prose stands alone: AGENTS.md section 5. Reject drafting
      # history and references to internal Markdown notes. Unlike the
      # hooks above this one is not about Python -- it reads the two .tex files
      # that make up the publication, so it selects on `files` rather than on
      # `types: [python]`. The supplement is part of the publication and is
      # covered identically.
      - id: check-prose
        name: publication prose has no drafting history or markdown references
        entry: bash -c 'cd simulations && uv run python check_prose.py'
        language: system
        files: ^((main|supplementary)\.tex|simulations/(test_)?check_prose\.py)$
        pass_filenames: false

      # Disclaimer and reader-instruction language. Advisory: unlike
      # check-prose this reports and always passes, because whether a hedge
      # earns its place is a judgement about the paragraph it sits in, not a
      # rule. `verbose: true` so the report is visible on a passing run --
      # a silent advisory hook is no hook at all.
      - id: check-hedging
        name: disclaimer language report (advisory)
        entry: bash -c 'cd simulations && uv run python check_hedging.py'
        language: system
        files: ^(main|supplementary)\.tex$
        pass_filenames: false
        verbose: true

      # Table S1 status column cross-reference against Chain.lean
      - id: check-table
        name: table S1 status column matches chain.lean
        entry: bash -c 'cd simulations && uv run python check_tableS1.py'
        language: system
        files: ^(supplementary\.tex|.*Chain\.lean)$
        pass_filenames: false

      # Tracked PDFs are deliverables: README.md and index.html link
      # main.pdf, supplementary.pdf and docs/primer.pdf directly, so a source
      # change committed without the rebuilt PDF publishes stale text to
      # whoever follows one of those links. Selects on `files` for the same
      # reason check-prose does -- it reads documents, not Python. Also reports,
      # without failing, a publication change that leaves the companion primer
      # untouched; hence `verbose: true`, as for check-hedging.
      - id: check-pdf-freshness
        name: tracked pdfs are as new as their sources
        entry: bash -c 'cd simulations && uv run python check_pdf_freshness.py'
        language: system
        files: \.(tex|png|pdf)$
        pass_filenames: false
        verbose: true

      # One document on arXiv: prepare_arxiv.sh merges the supplement into the
      # article as an appendix, so a figure both files include is printed twice
      # in the submitted PDF under two numbers. Neither source file can see it.
      - id: check-figures
        name: no figure is printed twice
        entry: bash -c 'cd simulations && uv run python check_figures.py'
        language: system
        files: ^(main|supplementary)\.tex$
        pass_filenames: false

      # The uploaded artifact is arxiv_submit/, which is not tracked, so no diff
      # ever shows it going stale. Passes when there is no built submission --
      # the escape hatch is `rm -rf arxiv_submit`, not a stale directory.
      - id: check-arxiv-freshness
        name: the built arxiv submission matches the manuscript
        entry: bash -c 'cd simulations && uv run python check_arxiv_freshness.py'
        language: system
        files: \.(tex|png|sty|sh)$
        pass_filenames: false

      # Leaf detector: every phase module must have at least one theorem
      # consumed outside itself and Examples.lean. Runs on any Lean file change.
      - id: check-leaves
        name: no leaf modules with unconsumed theorems
        entry: bash -c 'cd simulations && uv run python check_leaves.py'
        language: system
        files: \.lean$
        pass_filenames: false

      # `sorry` detector. `lake build` prints `declaration uses 'sorry'` as a
      # warning and exits 0, so the one thing that would falsify "machine-
      # checked" is the one thing the build does not gate. `Audit.lean` rejects
      # `sorryAx` for real, but it runs only in the Lean CI job; this is the
      # same check in the two seconds before the commit, and it additionally
      # sees `example ... := sorry`, which adds no constant for a sweep to find.
      - id: check-sorry
        name: no sorry in lean source
        entry: bash -c 'cd simulations && uv run python check_sorry.py'
        language: system
        files: \.lean$
        pass_filenames: false

      - id: check-proof-companion
        name: proof companion sources, extraction, and PDF are current
        entry: bash proof_companion/run.sh check
        language: system
        files: ^(proof_companion/|PhysicsOfConsciousness/|PhysicsOfConsciousness\.lean$|lean-toolchain$|lake-manifest\.json$|lakefile\.toml$)
        pass_filenames: false
