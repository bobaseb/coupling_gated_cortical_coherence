# mutmut 3 runs pytest in-process from inside mutants/ and reads no `runner`
# key, so the interpreter is whichever one mutmut itself was started under:
#   UV_PROJECT_ENVIRONMENT=.venv_new uv run mutmut run
# Extra pytest flags go here rather than in a shell command.
#
# `-p no:tach` disables the tach pytest plugin, which is installed and active by
# default -- it does not wait to be asked for with `--tach`. It must be off for
# two independent reasons. It hangs: mutmut runs pytest in-process in a forked
# worker, and the plugin never returns there, so every mutant is killed by the
# wall-clock limit and scored "timeout" while the machine sits idle. The same
# mutant dies in 0.95s with the plugin off. And were it to run, `--tach` is
# git-diff impact analysis: deselecting tests by what a branch changed would let
# mutants survive for want of the test that kills them. Its commit-path job,
# `tach check`, is a separate command and is unaffected.
pytest_add_cli_args =
    -p
    no:cacheprovider
    -p
    no:tach


# Rerun rather than warn when an untrackable dependency changes. The default
# keeps the cached verdicts and prints a warning, which is the worst outcome
# available here: a run that reuses stale results still prints a score, and a
# stale score is indistinguishable from a real one. Editing this file already
# produced exactly that -- a probe that "confirmed" 55 timeouts it never ran.
on_dependency_change = rerun
