[project]
name = "simulations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.168.0",
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "radon>=6.0.1",
    "ruff>=0.16.5",
    "setuptools>=84.0.0",
    "tach>=0.35.0",
    "vulture>=2.16",
    "xenon>=0.9.3",
]

[tool.vulture]
# `uv run vulture .` from this directory would otherwise walk `.venv`,
# where a site-packages file exceeds the AST recursion limit. `mutants/` is the
# tree `mutmut` writes, ~20k generated functions that are dead by construction.
exclude = [".venv/", ".venv_new/", "mutants/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
ignore = []

[tool.mypy]
strict = true
disallow_untyped_defs = true
# The commit hooks run these tools over this whole directory, so each one has to
# be told about `mutants/`: `mutmut` fills it with a rewritten copy of every
# source file, and type-checking twenty thousand generated mutants on the way
# into a commit would cost minutes and say nothing about the code being
# committed. The same goes for the second virtualenv the mutation runs use.
exclude = ["^mutants/", "^\\.venv"]


[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "tqdm.*",
    "sympy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = [
    "mutants",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
